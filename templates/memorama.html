<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Memorama Cognitivo | ActiveBreak</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body class="bg-light memorama-body">
        <div class="container py-4">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left mr-1"></i> Volver al Inicio
                </a>
                <div class="text-right">
                    <span class="badge badge-pill badge-primary px-3 py-2">
                        <i class="fas fa-user mr-1"></i> {{ empleado['nombre'] }}
                    </span>
                </div>
            </div>

            <div class="text-center mb-4">
                <h2 class="font-weight-bold text-dark">
                    <i class="fas fa-brain text-info mr-2"></i>Memorama Cognitivo
                </h2>
                <p class="text-muted mb-2">Estimula tu memoria visual encontrando todas las parejas de tarjetas.</p>
                
                <div class="d-inline-flex align-items-center bg-white px-3 py-2 rounded shadow-sm border">
                    <i class="fas fa-stopwatch text-warning mr-2"></i>
                    <span class="font-weight-bold text-secondary mr-2">Tiempo:</span>
                    <span id="tiempo" class="font-weight-bold text-primary">00:00</span>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body p-3">
                            <div class="memorama-container">
                                <div class="grid-memorama" id="memorama">
                                    <!-- Las tarjetas se generan dinámicamente desde pausas.js -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mb-4">
                        <button id="reset-button" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-redo-alt mr-1"></i> Reiniciar Tablero
                        </button>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 text-center">
                            <h5 class="card-title font-weight-bold mb-3">¿Terminaste tu sesión?</h5>
                            <form method="POST" id="guardar-form">
                                <input type="hidden" name="tiempo_sesion_segundos" id="tiempo_sesion_segundos" value="0">
                                <input type="hidden" name="hora_inicio" id="hora_inicio" value="">
                                <input type="hidden" name="hora_fin" id="hora_fin" value="">

                                <div class="custom-control custom-checkbox mb-3">
                                    <input type="checkbox" class="custom-control-input" id="checkPausa" name="pausas_realizadas" value="Sí" checked>
                                    <label class="custom-control-label text-muted" for="checkPausa">
                                        Confirmo que completé la pausa activa
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-success btn-block font-weight-bold py-2 shadow-sm">
                                    <i class="fas fa-check-circle mr-2"></i>Completar y Registrar Actividad
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Inicializar timestamp de inicio si no existe
                if (!sessionStorage.getItem("inicioSesionPausa")) {
                    sessionStorage.setItem("inicioSesionPausa", new Date().toISOString());
                }

                // Captura de métricas de sesión al enviar el formulario
                document.getElementById("guardar-form").addEventListener("submit", function () {
                    const timestampInicio = sessionStorage.getItem("inicioSesionPausa");
                    const inicio = timestampInicio ? new Date(timestampInicio) : new Date();
                    const fin = new Date();
                    const duracionSegundos = Math.max(1, Math.floor((fin - inicio) / 1000));

                    document.getElementById("tiempo_sesion_segundos").value = duracionSegundos;
                    document.getElementById("hora_inicio").value = inicio.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById("hora_fin").value = fin.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    sessionStorage.removeItem("inicioSesionPausa");
                });
            });
        </script>
        
        <script src="{{ url_for('static', filename='pausas.js') }}"></script>
    </body>
</html>
